<!DOCTYPE html>
<html>
<head>

<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .btn a{
        text-decoration: none;
        color: rgb(0, 0, 0);
    }
    .btn:hover{
        background-color: white;
        color: rgb(230, 98, 98);
    }
     .back-btn{
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    z-index: 9999;
    background-color: #146c43;
    color: aliceblue;
    border-radius: 8px;
}
.back-btn a{
    text-decoration: none;
   color: black;
}

.back-btn:hover{
    background: white;
    transform: scale(1.05);
    
}
</style>
</head>

<body class="bg-light">
<button class="back-btn" onclick="history.back()"><a href="home.html">← Back</a>
</button>

<div class="container">

<div class="card p-4 mt-5">

<h2>Payment Details</h2>

<form action="success.html">

<select class="form-select mb-3" required>
    <option value="">-- Select Payment Method --</option>
    <option>Cash On Delivery</option>
    <option>UPI</option>
    <option>Debit Card</option>
    <option>Credit Card</option>
</select>

<input
type="text"
class="form-control mb-3"
placeholder="Card Number"
required>

<input
type="text"
class="form-control mb-3"
placeholder="Card Holder Name"
required>

<div class="row">

<div class="col">
<input
type="text"
class="form-control"
placeholder="MM/YY"
required>
</div>

<div class="col">
<input
type="password"
class="form-control"
placeholder="CVV"
maxlength="3"
required>
</div>

</div>

<button type="submit" class="btn btn-success mt-4 w-100"><a href="sucess.html">Pay Now</a>

</button>

</form>

</div>

</div>

</body>
</html>
