<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#198754;
}

.btn-success{
    width:100%;
}
.btn a{
    text-decoration: none;
    color: black;
}
.back-back{
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    z-index: 9999;
    background-color: #146c43;
    color: aliceblue;
    border-radius: 8px;
}
.back-back a{
    text-decoration: none;
    color: aliceblue;
}
</style>

</head>
<body>
<button class="back-back" onclick="history.back()"><a href="home.html">← Back</a>
</button>
<div class="login-box">
<h2>Sign In</h2>

<form>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" placeholder="Enter Email">
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" placeholder="Enter Password">
</div>

<button class="btn btn-success"><a href="home.html">SignIn</a></button>

<p class="text-center mt-3">
Don't have an account?
<a href="">Register</a>
</p>

</form>

</div>

</body>
</html>
