<!DOCTYPE html>
<html>
<head>
    <title>Order Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .back-btn{
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    z-index: 9999;
    background-color: #146c43;
    color: aliceblue;
    border-radius: 8px;
}
.back-btn a{
    text-decoration: none;
   color: black;
}

.back-btn:hover{
    background: white;
    transform: scale(1.05);
    
}
</style>

</head>

<body class="bg-light">
<button class="back-btn" onclick="history.back()"><a href="home.html">← Back</a>
</button>
<div class="container">

<div class="card p-4 mt-5">
 
<h2>Order Details</h2>

<form action="payment.html">

<input type="text" class="form-control my-3" placeholder="Full Name" required>

<input type="tel" class="form-control my-3" placeholder="Phone Number" required>

<input type="email" class="form-control my-3" placeholder="Email" required>

<textarea class="form-control my-3" placeholder="Address" required></textarea>

<input type="text" class="form-control my-3" placeholder="City" required>

<input type="text" class="form-control my-3" placeholder="Pincode" required>

<button type="submit" class="btn btn-primary w-100">
    Proceed To Payment
</button>

</form>

</div>

</div>

</body>
</html>
